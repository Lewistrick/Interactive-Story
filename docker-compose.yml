services:
  postgres:
    image: postgres:16-alpine
    container_name: istory-postgres
    environment:
      POSTGRES_USER: istory
      POSTGRES_PASSWORD: istory_dev_password
      POSTGRES_DB: istory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istory -d istory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: istory-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istory-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://istory:istory_dev_password@postgres:5432/istory
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-compose-dev-secret-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      APP_NAME: Interactive Story App
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      # Migrations handle schema; skip duplicate create_all (does NOT skip score refresh)
      SKIP_DB_INIT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: istory-frontend
    ports:
      - "8001:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
