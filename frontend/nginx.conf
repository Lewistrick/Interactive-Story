server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # $http_host keeps the client port (e.g. localhost:8001).
        # $host alone strips it and breaks FastAPI trailing-slash redirects.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Do not let upstream absolute redirects escape to the wrong host/port
        proxy_redirect http://backend:8000/ /;
        proxy_redirect http://127.0.0.1:8000/ /;
    }

    # Backend health + OpenAPI docs
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
